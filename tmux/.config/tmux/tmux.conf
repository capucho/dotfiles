# =============================================================================
# Tmux Configuration with Catpuccin Theme and Alt-Key Bindings
# =============================================================================

# Use 256 colors
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

set-option -g status-position top

# =============================================================================
# Catppuccin Theme - Mocha Flavor (v2 API — plugin uses "catppuccin", not "catpuccin")
# =============================================================================
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"

# Window tabs: rounded pill style, number on right, text = program name (not pane_title/host)
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text " #{b:pane_current_path}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"
set -g @catppuccin_window_flags "icon"

# Status modules
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_middle_separator " "
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"
set -g @catppuccin_date_time_text " %H:%M  %d-%b-%y"

# Compose the bar: session on the left; directory + clock on the right
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"
set -g status-left-length 40
set -g status-right-length 60
set -g status-justify left

# =============================================================================
# General Settings
# =============================================================================
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#{pane_current_path} - #{pane_current_command}"

# =============================================================================
# Keybindings - Alt (Option) Key Navigation
# =============================================================================

# Pane Navigation - Alt + hjkl
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Kill Pane - Alt + x
bind -n M-x kill-pane

# Kill Window - Alt + Shift + x
bind -n M-X kill-window

# New Window - Alt + n
bind -n M-n new-window -c "#{pane_current_path}"

# Rename Window - Alt + r
bind -n M-r command-prompt -I "#{window_name}" "rename-window '%%'"

# Navigate between windows - Alt + , and Alt + .
# (avoid M-[ / M-]: ESC[ is the CSI introducer, same prefix as arrow keys,
#  SGR mouse reporting, and bracketed paste -> flaky disambiguation)
bind -n M-, previous-window
bind -n M-. next-window

# Create Panes - Alt + - (horizontal) and Alt + \ (vertical)
bind -n M-- split-window -h -c "#{pane_current_path}"
bind -n 'M-\' split-window -v -c "#{pane_current_path}"

# Reload config - prefix + r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# =============================================================================
# Tmux Plugin Manager (TPM) Configuration
# =============================================================================
# Remember to clone git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# Initialize TPM — must be the last line
run "~/.config/tmux/plugins/tpm/tpm"