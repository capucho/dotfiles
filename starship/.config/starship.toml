"$schema" = "https://starship.rs/config-schema.json"

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$bun\
$rust\
$line_break\
$character"""

command_timeout = 500

# ─── Directory ────────────────────────────────────────────────────────────────

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold blue"
read_only = " "
read_only_style = "red"

# ─── Git ──────────────────────────────────────────────────────────────────────

[git_branch]
format = "[$symbol$branch]($style) "
style = "bold purple"
truncation_length = 30
truncation_symbol = "…"

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold red"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"
stashed = ""

# ─── Runtimes ─────────────────────────────────────────────────────────────────

[nodejs]
format = "[$symbol$version]($style) "
style = "bold green"
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[python]
format = "[$symbol$version]($style) "
style = "bold yellow"
detect_files = ["pyproject.toml", ".python-version", "uv.lock", "requirements.txt"]
detect_folders = [".venv"]
detect_extensions = ["py"]

[bun]
format = "[$symbol$version]($style) "
style = "bold yellow"
detect_files = ["bun.lock", "bun.lockb", "bunfig.toml"]

[rust]
format = "[$symbol$version]($style) "
style = "bold red"
detect_files = ["Cargo.toml"]

# ─── Prompt character ────────────────────────────────────────────────────────

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

